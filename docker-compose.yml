# ==============================================================================
# Base Docker Compose Configuration — Event-Driven Kafka Architecture
#
# Defines core services, dependencies, networks, volumes, healthchecks, and
# dynamic resource limits.
#
# Usage:
#   Development: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Auto-calibrated: scripts/start.sh (or ENV=prod scripts/start.sh)
# ==============================================================================

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: ${ZK_HEAP_OPTS:--Xmx256m -Xms128m}
    mem_limit: ${ZK_MEM_LIMIT:-512m}
    cpus: ${ZK_CPUS:-0.5}
    healthcheck:
      test: echo srvr | nc localhost 2181
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - event-driven-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_COMPRESSION_TYPE: producer
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx512m -Xms256m}
    mem_limit: ${KAFKA_MEM_LIMIT:-1250m}
    cpus: ${KAFKA_CPUS:-1.5}
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - event-driven-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-event_driven_test}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command: postgres -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB} -c max_connections=200
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    cpus: ${POSTGRES_CPUS:-1.0}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-event_driven_test}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - event-driven-network

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: event-driven-api
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:29092
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-event_driven_test}
      NODE_OPTIONS: ${APP_NODE_OPTIONS:---max-old-space-size=384}
    mem_limit: ${APP_MEM_LIMIT:-512m}
    cpus: ${APP_CPUS:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - event-driven-network

volumes:
  postgres_data:
    driver: local

networks:
  event-driven-network:
    name: event-driven-network
    driver: bridge
