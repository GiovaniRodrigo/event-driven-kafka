name: Benchmark & Resilience Suite

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Benchmark suite to execute (all, performance, resilience, or specific scenario)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - performance
          - resilience
          - baseline
          - normal
          - stress
          - spike
          - e2e-latency
          - outbox
          - saga
          - retry-dlq
  schedule:
    # Run weekly on Sunday midnight
    - cron: '0 0 * * 0'

jobs:
  benchmark:
    name: Execute Benchmark Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: event_driven_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d event_driven_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181

      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports:
          - 9092:9092

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/event_driven_test
      KAFKA_BROKER: localhost:9092
      KAFKA_CLIENT_ID: ci-benchmark-client
      KAFKA_GROUP_ID: ci-benchmark-group
      LOG_LEVEL: warn

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Wait for Infrastructure Readiness
        run: |
          echo "Waiting for PostgreSQL..."
          until pg_isready -h localhost -p 5432 -U postgres -d event_driven_test; do
            sleep 1
          done
          echo "PostgreSQL is ready."

          echo "Waiting for Kafka..."
          timeout 60 bash -c 'until nc -z localhost 9092; do sleep 1; done'
          echo "Kafka port is open."

      - name: Initialize Database Schema
        run: |
          npm run build
          node -e "
            const { Pool } = require('pg');
            const fs = require('fs');
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            const sql = fs.readFileSync('scripts/init-db.sql', 'utf8');
            pool.query(sql).then(() => { console.log('Database initialized successfully'); process.exit(0); }).catch(e => { console.error(e); process.exit(1); });
          "

      - name: Execute Benchmark Run
        run: |
          SUITE="${{ github.event.inputs.suite || 'all' }}"
          echo "Executing benchmark suite: ${SUITE}"
          if [[ "$SUITE" == "all" || "$SUITE" == "performance" || "$SUITE" == "resilience" ]]; then
            npx ts-node benchmarks/runner.ts --suite="${SUITE}"
          else
            npx ts-node benchmarks/runner.ts --scenario="${SUITE}"
          fi

      - name: Upload Benchmark Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            benchmark-results/
            benchmark-baseline.json
          retention-days: 30
